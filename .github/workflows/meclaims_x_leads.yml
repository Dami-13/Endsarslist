name: MeClaims X lead scan

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/meclaims_x_leads.py'
      - '.github/workflows/meclaims_x_leads.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: pip install requests requests-oauthlib

      - name: Search X without posting
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python tools/meclaims_x_leads.py

      - name: Upload ranked lead queue
        uses: actions/upload-artifact@v4
        with:
          name: meclaims-x-leads
          path: artifacts/meclaims-x-leads.json
          retention-days: 14
          if-no-files-found: error
