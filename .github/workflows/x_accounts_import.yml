name: Import X missing-person accounts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (extract only, nothing saved)?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests requests-oauthlib

      - name: Run import
        env:
          D1_ADMIN_TOKEN: ${{ secrets.D1_ADMIN_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.ENDSARSLISTOPENAISECRET }}
          API_BASE_URL: https://endsarslist-api.damidude.workers.dev
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            python x_accounts_import.py
          else
            python x_accounts_import.py --dry-run
          fi

      - name: Upload extracted names
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x-import-preview
          path: x_import_preview.json
          if-no-files-found: ignore
